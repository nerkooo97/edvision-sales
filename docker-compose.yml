services:
  sales-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edvision-sales-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    # Docker keeps container logs forever by default; keep at most 3 files of 10 MB, oldest deleted first.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
