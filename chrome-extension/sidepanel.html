<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        html,
        body {
            height: 100%;
        }

        body {
            box-sizing: border-box;
            min-height: 100%;
            font-family: Arial, sans-serif;
            padding: 16px;
            background: #f4f5f7;
            color: #333;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        h3 {
            margin: 0;
            font-size: 16px;
            color: #222;
            text-align: left;
        }

        .subtitle {
            font-size: 11px;
            color: #666;
            margin: 0;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            font-size: 11px;
            font-weight: bold;
            display: block;
            margin-bottom: 3px;
        }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 12px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #d9534f;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            font-size: 13px;
        }

        button:hover {
            background-color: #c9302c;
        }

        button.secondary {
            background-color: #555;
            margin-top: 6px;
            padding: 8px;
            font-size: 11px;
        }

        button.secondary:hover {
            background-color: #333;
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        #pageInfo {
            font-size: 11px;
            color: #555;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            word-break: break-all;
            line-height: 1.4;
        }

        #pageInfo.ok {
            border-color: #28a745;
            color: #1b6e30;
        }

        #pageInfo.bad {
            border-color: #d9534f;
            color: #a94442;
        }

        details {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 8px 10px;
        }

        summary {
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            outline: none;
        }

        #dashboard {
            display: none;
            background: #fff;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #ddd;
            flex: 1;
        }

        .stat-row {
            font-size: 13px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .stat-label {
            font-weight: bold;
            color: #555;
        }

        #statusText {
            font-size: 12px;
            color: #0066cc;
            margin-top: 12px;
            font-style: italic;
            word-break: break-word;
            line-height: 1.4;
        }

        #settingsMsg {
            font-size: 11px;
            margin-top: 6px;
            color: #555;
        }

        .toggle-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 12px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .toggle-row input {
            width: auto;
            margin-top: 2px;
        }

        .toggle-row label {
            font-weight: normal;
            margin: 0;
            cursor: pointer;
        }

        .toggle-hint {
            display: block;
            font-size: 10px;
            color: #777;
            margin-top: 4px;
        }

        #restartBtn {
            display: none;
            margin-top: 12px;
        }

        .panel-footer {
            margin-top: auto;
            font-size: 10px;
            color: #888;
        }
    </style>
</head>

<body>
    <div>
        <h3>CompanyWall → Appwrite</h3>
        <p class="subtitle">Panel ostaje otvoren dok skrapuješ — progress se vidi uživo.</p>
    </div>

    <div id="pageInfo">Provjeravam aktivni tab...</div>
    <button type="button" class="secondary" id="refreshTabBtn" style="margin-top:0;">Osvježi aktivni tab</button>

    <details id="settingsPanel">
        <summary>Appwrite settings</summary>
        <div class="form-group" style="margin-top:8px;">
            <label for="awEndpoint">Endpoint</label>
            <input type="url" id="awEndpoint" placeholder="https://appwrite.ed-vision.com/v1">
        </div>
        <div class="form-group">
            <label for="awProjectId">Project ID</label>
            <input type="text" id="awProjectId" autocomplete="off" placeholder="6a7dd764002484e4cc47">
        </div>
        <div class="form-group">
            <label for="awDatabaseId">Database ID</label>
            <input type="text" id="awDatabaseId" autocomplete="off" placeholder="6a7dd77a002b3913d433">
        </div>
        <div class="form-group">
            <label for="awTableId">Table ID</label>
            <input type="text" id="awTableId" autocomplete="off" placeholder="companies">
        </div>
        <div class="form-group">
            <label for="awApiKey">API Key</label>
            <input type="password" id="awApiKey" autocomplete="off" placeholder="Zalijepi key ovdje">
        </div>
        <button type="button" class="secondary" id="saveSettingsBtn">Sačuvaj settings</button>
        <button type="button" class="secondary" id="testSettingsBtn">Test konekcije</button>
        <div id="settingsMsg"></div>
    </details>

    <div id="scrapeControls">
        <div class="form-group" id="inputGroup">
            <label for="limitInput">Broj firmi:</label>
            <input type="number" id="limitInput" value="20" min="1" max="500">
        </div>
        <div class="toggle-row">
            <input type="checkbox" id="overwriteToggle">
            <label for="overwriteToggle">
                Overwrite postojećih (po company_name)
                <span class="toggle-hint">Isključeno = preskoči ako već postoji isti company_name. Uključeno = ažuriraj podatke firme.</span>
            </label>
        </div>
        <button id="startBtn" disabled>Pokreni skrap → Appwrite</button>
    </div>

    <div id="dashboard">
        <div class="stat-row">
            <span class="stat-label">Status:</span>
            <span id="statStatus" style="color:#d9534f;font-weight:bold;">U toku...</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Skrapovano:</span>
            <span id="statCount">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Nove / update:</span>
            <span id="statSaved">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Preskočeno:</span>
            <span id="statSkipped">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Greške:</span>
            <span id="statFailed">0</span>
        </div>
        <div id="statusText">Povezivanje...</div>
        <button type="button" class="secondary" id="restartBtn">Pokreni ponovo</button>
    </div>

    <div class="panel-footer">Klik na ikonu ekstenzije otvara/zatvara ovaj panel.</div>

    <script src="sidepanel.js"></script>
</body>

</html>
